# Execute from server.cfg after configuring your own admin principals.
# This grants no permission to ordinary players.
add_ace group.admin blast.clogs.admin allow
add_ace group.admin blast.clogs.creator allow

# Optional: grant creator-only access to a separate group you control.
# add_ace group.clog_creators blast.clogs.creator allow
